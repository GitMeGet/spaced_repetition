    <rect x="-28" y="128" width="56" height="132" fill="#111827"/>
    <rect x="-28" y="164" width="56" height="44" fill="#facc15"/>
    <rect x="-44" y="260" width="88" height="14" rx="7" fill="#64748b"/>
  </g>
