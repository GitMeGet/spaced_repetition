<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Isolated danger mark</title>
  <desc id="desc">Black and red pillar mark with two black spheres and white group flashing two light rhythm.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#102033">Isolated Danger Mark</text>
  <g transform="translate(260 104)">
    <rect x="-24" y="112" width="48" height="150" fill="#111827"/>
    <rect x="-24" y="156" width="48" height="44" fill="#ef233c"/>
    <polygon points="-78,262 78,262 38,204 -38,204" fill="#ef233c"/>
    <circle cx="0" cy="64" r="22" fill="#111827"/>
    <circle cx="0" cy="18" r="22" fill="#111827"/>
  </g>
  <g transform="translate(520 112)" font-family="Arial, sans-serif" fill="#102033">
    <text x="0" y="30" font-size="22" font-weight="700">Use</text>
    <text x="0" y="66" font-size="18">Marks an isolated danger with</text>
    <text x="0" y="92" font-size="18">navigable water all around.</text>
    <text x="0" y="144" font-size="22" font-weight="700">Features</text>
    <text x="0" y="180" font-size="18">Colour: black and red</text>
    <text x="0" y="206" font-size="18">Shape: pillar or spar</text>
    <text x="0" y="232" font-size="18">Topmark: two black spheres</text>
    <text x="0" y="258" font-size="18">Light: white, group flashing (2)</text>
  </g>
  <g transform="translate(520 342)">
    <rect x="0" y="0" width="38" height="18" fill="#111827"/>
    <rect x="46" y="0" width="38" height="18" fill="#fff" stroke="#111827"/>
    <rect x="92" y="0" width="38" height="18" fill="#111827"/>
    <text x="154" y="15" font-family="Arial, sans-serif" font-size="16" fill="#102033">Fl(2) white</text>
  </g>
</svg>
