<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Safe water mark</title>
  <desc id="desc">Safe water mark with red and white vertical stripes, red sphere topmark and white light rhythms.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#102033">Safe Water Mark</text>
  <g transform="translate(240 106)">
    <circle cx="-92" cy="164" r="58" fill="#fff" stroke="#d71920" stroke-width="18"/>
    <path d="M-92 106 A58 58 0 0 1 -92 222" fill="none" stroke="#d71920" stroke-width="18"/>
    <rect x="10" y="94" width="72" height="142" rx="8" fill="#fff" stroke="#d71920" stroke-width="18"/>
    <rect x="138" y="70" width="28" height="166" fill="#fff" stroke="#d71920" stroke-width="14"/>
    <circle cx="46" cy="48" r="18" fill="#d71920"/>
    <circle cx="152" cy="48" r="18" fill="#d71920"/>
  </g>
  <g transform="translate(512 120)" font-family="Arial, sans-serif" fill="#102033">
    <text x="0" y="22" font-size="22" font-weight="700">Meaning</text>
    <text x="0" y="58" font-size="18">Navigable water all around the mark.</text>
    <text x="0" y="110" font-size="22" font-weight="700">Features</text>
    <text x="0" y="146" font-size="18">Colour: red and white vertical stripes</text>
    <text x="0" y="172" font-size="18">Shape: spherical, pillar or spar</text>
    <text x="0" y="198" font-size="18">Topmark: single red sphere</text>
    <text x="0" y="224" font-size="18">Light: white; Iso, Occ, LFl 10s or Morse A</text>
  </g>
  <g transform="translate(512 360)">
    <rect x="0" y="0" width="38" height="18" fill="#fff" stroke="#111827"/>
    <rect x="48" y="0" width="38" height="18" fill="#111827"/>
    <rect x="96" y="0" width="74" height="18" fill="#fff" stroke="#111827"/>
    <text x="194" y="15" font-family="Arial, sans-serif" font-size="16" fill="#102033">Morse A / LFl</text>
  </g>
</svg>
