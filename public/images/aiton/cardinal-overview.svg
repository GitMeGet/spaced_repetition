<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Cardinal marks overview</title>
  <desc id="desc">North, East, South and West cardinal marks around a central hazard with topmarks, colours and rhythms.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#102033">Cardinal Marks - Pass The Named Side</text>
  <g transform="translate(450 275)">
    <rect x="-72" y="-44" width="144" height="88" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Hazard</text>
    <line x1="-230" y1="-190" x2="230" y2="190" stroke="#334155" stroke-width="3"/>
    <line x1="230" y1="-190" x2="-230" y2="190" stroke="#334155" stroke-width="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#102033" text-anchor="middle">
    <g transform="translate(450 86)">
      <rect x="-18" y="98" width="36" height="86" fill="#facc15"/>
      <rect x="-18" y="98" width="36" height="44" fill="#111827"/>
      <polygon points="0,14 -20,54 20,54" fill="#111827"/>
      <polygon points="0,56 -20,96 20,96" fill="#111827"/>
      <text x="0" y="218">North: Q or VQ</text>
    </g>
    <g transform="translate(698 206)">
      <rect x="-18" y="86" width="36" height="98" fill="#111827"/>
      <rect x="-18" y="116" width="36" height="38" fill="#facc15"/>
      <polygon points="0,14 -22,54 22,54" fill="#111827"/>
      <polygon points="0,96 -22,56 22,56" fill="#111827"/>
      <text x="0" y="220">East: Q(3)</text>
    </g>
    <g transform="translate(450 314)">
      <rect x="-18" y="76" width="36" height="108" fill="#111827"/>
      <rect x="-18" y="76" width="36" height="52" fill="#facc15"/>
      <polygon points="0,96 -20,56 20,56" fill="#111827"/>
      <polygon points="0,54 -20,14 20,14" fill="#111827"/>
      <text x="0" y="218">South: Q(6)+LFl</text>
    </g>
    <g transform="translate(202 206)">
      <rect x="-18" y="86" width="36" height="98" fill="#facc15"/>
      <rect x="-18" y="116" width="36" height="38" fill="#111827"/>
      <polygon points="0,54 -22,14 22,14" fill="#111827"/>
      <polygon points="0,56 -22,96 22,96" fill="#111827"/>
      <text x="0" y="220">West: Q(9)</text>
    </g>
  </g>
</svg>
