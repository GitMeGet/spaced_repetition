<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">IALA Region A lateral marks</title>
  <desc id="desc">Port hand red can mark on the left and starboard hand green cone mark on the right in the direction of buoyage.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#102033">IALA Region A Lateral Marks</text>
  <g transform="translate(450 242)">
    <path d="M0 118 L0 -86" stroke="#7c3aed" stroke-width="5"/>
    <path d="M0 -100 L-46 -34 L-14 -44 L-14 118 L14 118 L14 -44 L46 -34 Z" fill="#fff" stroke="#7c3aed" stroke-width="4"/>
    <text x="0" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#102033">Direction of buoyage</text>
  </g>
  <g transform="translate(230 122)">
    <rect x="-42" y="128" width="84" height="96" rx="14" fill="#d71920"/>
    <rect x="-54" y="224" width="108" height="14" rx="7" fill="#991b1b"/>
    <polygon points="-46,112 46,112 30,68 -30,68" fill="#d71920"/>
    <circle cx="0" cy="42" r="16" fill="#ef233c"/>
    <text x="0" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Port hand</text>
    <text x="0" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">red / can / red light</text>
  </g>
  <g transform="translate(670 122)">
    <rect x="-42" y="128" width="84" height="96" rx="14" fill="#0a8f45"/>
    <rect x="-54" y="224" width="108" height="14" rx="7" fill="#166534"/>
    <polygon points="0,68 52,112 -52,112" fill="#0a8f45"/>
    <circle cx="0" cy="42" r="16" fill="#16a34a"/>
    <text x="0" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Starboard hand</text>
    <text x="0" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#166534">green / cone / green light</text>
  </g>
</svg>
