<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Special mark</title>
  <desc id="desc">Yellow special marks with optional shape, yellow X topmark and yellow light.</desc>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#102033">Special Mark</text>
  <g transform="translate(256 100)">
    <rect x="-44" y="128" width="88" height="120" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <polygon points="126,248 196,248 178,130 144,130" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="-126" cy="188" r="54" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <line x1="-36" y1="46" x2="36" y2="100" stroke="#facc15" stroke-width="18" stroke-linecap="round"/>
    <line x1="36" y1="46" x2="-36" y2="100" stroke="#facc15" stroke-width="18" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="17" fill="#facc15"/>
  </g>
  <g transform="translate(520 122)" font-family="Arial, sans-serif" fill="#102033">
    <text x="0" y="22" font-size="22" font-weight="700">Use</text>
    <text x="0" y="58" font-size="18">Special area or feature, not a primary danger.</text>
    <text x="0" y="94" font-size="18">Examples: cable, pipeline, recreation, military</text>
    <text x="0" y="146" font-size="22" font-weight="700">Features</text>
    <text x="0" y="182" font-size="18">Colour: yellow</text>
    <text x="0" y="208" font-size="18">Shape: optional, not conflicting</text>
    <text x="0" y="234" font-size="18">Topmark: single yellow X</text>
    <text x="0" y="260" font-size="18">Light: yellow, any non-confusing rhythm</text>
  </g>
</svg>
